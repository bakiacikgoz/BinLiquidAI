name: Local Product Platform Evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  collect-platform-evidence:
    name: Collect ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev
      - name: Collect platform evidence
        shell: bash
        run: |
          uv run binliquid local-product evidence collect \
            --target "${{ matrix.target }}" \
            --profile enterprise \
            --output-root "artifacts/local-product/evidence/${{ matrix.target }}" \
            --json
          uv run binliquid local-product evidence export \
            --manifest "artifacts/local-product/evidence/${{ matrix.target }}/platform_evidence_manifest.json" \
            --bundle "artifacts/local-product/evidence-bundles/${{ matrix.target }}.zip" \
            --json
          uv run binliquid local-product evidence verify \
            --bundle "artifacts/local-product/evidence-bundles/${{ matrix.target }}.zip" \
            --expected-target "${{ matrix.target }}" \
            --json
      - uses: actions/upload-artifact@v4
        with:
          name: local-product-evidence-${{ matrix.target }}-${{ github.sha }}
          path: |
            artifacts/local-product/evidence/${{ matrix.target }}/
            artifacts/local-product/evidence-bundles/${{ matrix.target }}.zip

  handoff-reconcile:
    runs-on: ubuntu-latest
    needs:
      - collect-platform-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev
      - uses: actions/download-artifact@v4
        with:
          pattern: local-product-evidence-*
          path: artifacts/local-product/downloaded-evidence
          merge-multiple: true
      - name: Import, reconcile, and build handoff
        shell: bash
        run: |
          find artifacts/local-product/downloaded-evidence -name '*.zip' -print0 | while IFS= read -r -d '' bundle; do
            uv run binliquid local-product evidence import \
              --bundle "$bundle" \
              --profile enterprise \
              --store-root artifacts/local-product/imported \
              --json
          done
          uv run binliquid local-product evidence reconcile \
            --profile enterprise \
            --store-root artifacts/local-product/imported \
            --output artifacts/local-product/platform_evidence_reconciliation.json \
            --json
          uv run binliquid local-product rc-handoff build \
            --profile enterprise \
            --evidence-root artifacts/local-product/imported \
            --output-root artifacts/local-product-rc-handoff \
            --json
          uv run binliquid local-product rc-handoff verify \
            --manifest artifacts/local-product-rc-handoff/manifest.json \
            --json
      - uses: actions/upload-artifact@v4
        with:
          name: local-product-rc-handoff
          path: |
            artifacts/local-product/platform_evidence_reconciliation.json
            artifacts/local-product-rc-handoff/
