[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "imperaos"
version = "0.4.1"
description = "Self-hosted Agent Control Plane for governed AI agent production readiness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [
  { name = "ImperaOS Contributors" }
]
dependencies = [
  "pydantic>=2.10.0,<3.0.0",
  "typer>=0.17.0,<1.0.0",
  "rich>=14.0.0,<15.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "ollama>=0.5.0,<1.0.0",
  "psutil>=6.1.0,<7.0.0",
  "cryptography>=44.0.0,<46.0.0",
  "editables>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "ruff>=0.12.0,<1.0.0",
]
hf = [
  "transformers>=4.45.0,<5.0.0",
  "torch>=2.4.0,<3.0.0",
]

[project.scripts]
imperaos = "binliquid.cli:app"
binliquid = "binliquid.cli:app"
aegis = "binliquid.cli:app"

[tool.hatch.build.targets.wheel]
dev-mode-exact = true
packages = ["binliquid", "benchmarks", "research", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
